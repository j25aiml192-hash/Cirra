version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    container_name: cirra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cirra_app
      POSTGRES_PASSWORD: cirrapassword
      POSTGRES_DB: cirra
    ports:
      - "5432:5432"
    volumes:
      - cirra_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: cirra_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
volumes:
  cirra_postgres_data:

