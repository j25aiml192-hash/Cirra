[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirra-action-engine"
version = "0.1.0"
description = "Cirra Temporal Remediation & Action Workflows"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.5.1",
    "pydantic>=2.6.4",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "ruff>=0.3.4"
]
