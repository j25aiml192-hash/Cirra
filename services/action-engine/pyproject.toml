[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirra-action-engine"
version = "0.1.0"
description = "Cirra Action Engine service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.6.0",
  "PyGithub>=2.3.0",
  "asyncpg>=0.29.0",
  "pydantic-settings>=2.2.0",
  "httpx>=0.27.0",
  "cryptography>=42.0.0",
  "python-jose[cryptography]>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
