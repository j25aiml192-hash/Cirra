[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirra-investigator"
version = "0.1.0"
description = "Cirra Investigator AI Agent, Semantic Layer & RAG Service"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.1.16",
    "langchain-openai>=0.1.3",
    "llama-index>=0.10.30",
    "pgvector>=0.2.5",
    "openai>=1.23.2",
    "httpx>=0.27.0",
    "sqlparse>=0.5.0",
    "clickhouse-connect>=0.7.7",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "ruff>=0.3.4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
