[project]
name = "cirra-investigator"
version = "0.1.0"
description = "Ask Cirra investigator service: text-to-SQL cost intelligence via Groq and ClickHouse"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "groq>=0.9.0",
  "sqlglot>=25.0.0",
  "clickhouse-connect>=0.7.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
