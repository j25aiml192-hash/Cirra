[project]
name = "cirra-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "celery[redis]>=5.3.0",
  "redis[asyncio]>=5.0.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "clickhouse-connect>=0.7.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "cryptography>=42.0.0",
  "boto3>=1.34.0",
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests as requiring real services (docker-compose postgres/clickhouse/redis)",
]
