[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirra-ingest"
version = "0.1.0"
description = "Cirra Ingestion Connectors & FOCUS Normalization Service"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.80",
    "google-cloud-bigquery>=3.20.1",
    "azure-mgmt-costmanagement>=4.0.1",
    "httpx>=0.27.0",
    "pandas>=2.2.1",
    "polars>=0.20.19",
    "pyarrow>=15.0.2",
    "celery[redis]>=5.3.6",
    "clickhouse-connect>=0.7.7",
    "pydantic>=2.6.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "ruff>=0.3.4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
