[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirra-api"
version = "0.1.0"
description = "Cirra Control Plane Main API Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "redis[asyncio]>=5.0.3",
    "celery[redis]>=5.3.6",
    "boto3>=1.34.80",
    "cryptography>=42.0.5",
    "clickhouse-connect>=0.7.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
