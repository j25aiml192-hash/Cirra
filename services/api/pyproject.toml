[project]
name = "cirra-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "python-multipart>=0.0.9",
  "pydantic[email]>=2.6.0",
  "pydantic-settings>=2.2.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "httpx>=0.27.0",
  "redis[asyncio]>=5.0.0",
  "cryptography>=42.0.0",
  "boto3>=1.34.0",
  "clickhouse-connect>=0.7.0",
  "celery>=5.3.0",
  "groq>=0.9.0",
  "vapi-python>=0.1.0",
  "slack-sdk>=3.27.0",
  "PyGithub>=2.3.0",
  "twilio>=9.0.0",
  "statsmodels>=0.14.0",
  "scipy>=1.13.0",
  "sqlglot>=25.0.0",
  "anthropic>=0.28.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests as requiring real services (docker-compose postgres/clickhouse/redis)",
]
