[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirra-sentinel"
version = "0.1.0"
description = "Cirra Sentinel Unsupervised Statistical Anomaly Detection Service"
requires-python = ">=3.11"
dependencies = [
    "statsmodels>=0.14.1",
    "scikit-learn>=1.4.1.post1",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "celery[redis]>=5.3.6",
    "clickhouse-connect>=0.7.7",
    "httpx>=0.27.0",
    "pydantic>=2.6.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "ruff>=0.3.4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
