[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirra-sentinel"
version = "0.1.0"
description = "Cirra Sentinel anomaly detection service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.6.0",
  "numpy>=1.26.0",
  "clickhouse-connect>=0.7.0",
  "asyncpg>=0.29.0",
  "apscheduler>=3.10.0",
  "pydantic-settings>=2.2.0",
  "scipy>=1.13.0",
  "statsmodels>=0.14.0",
  "httpx>=0.27.0",
  "slack-sdk>=3.27.0",
  "twilio>=9.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
