databases:
  - name: cirra-postgres
    databaseName: cirra
    user: cirra
    plan: free

services:
  - type: web
    name: cirra-investigator
    env: python
    plan: free
    region: oregon
    rootDir: services/investigator
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: INTERNAL_SERVICE_KEY
        value: internal-dev-key

  - type: web
    name: cirra-sentinel
    env: python
    plan: free
    region: oregon
    rootDir: services/sentinel
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cirra-postgres
          property: connectionString
      - key: CLICKHOUSE_HOST
        sync: false
      - key: CLICKHOUSE_PORT
        value: "8443"
      - key: CLICKHOUSE_USER
        sync: false
      - key: CLICKHOUSE_PASSWORD
        sync: false
      - key: CLICKHOUSE_DATABASE
        value: cirra
      - key: INVESTIGATOR_URL
        value: https://cirra-investigator.onrender.com
      - key: INTERNAL_SERVICE_KEY
        value: internal-dev-key
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: NTFY_TOPIC
        sync: false

  - type: web
    name: cirra-action-engine
    env: python
    plan: free
    region: oregon
    rootDir: services/action-engine
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cirra-postgres
          property: connectionString
      - key: INVESTIGATOR_URL
        value: https://cirra-investigator.onrender.com
      - key: INTERNAL_SERVICE_KEY
        value: internal-dev-key
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false

  - type: web
    name: cirra-api
    env: python
    plan: free
    region: oregon
    rootDir: services/api
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cirra-postgres
          property: connectionString
      - key: CLICKHOUSE_HOST
        sync: false
      - key: CLICKHOUSE_PORT
        value: "8443"
      - key: CLICKHOUSE_USER
        sync: false
      - key: CLICKHOUSE_PASSWORD
        sync: false
      - key: CLICKHOUSE_DATABASE
        value: cirra
      - key: INVESTIGATOR_URL
        value: https://cirra-investigator.onrender.com
      - key: SENTINEL_URL
        value: https://cirra-sentinel.onrender.com
      - key: ACTION_ENGINE_URL
        value: https://cirra-action-engine.onrender.com
      - key: INTERNAL_SERVICE_KEY
        value: internal-dev-key
      - key: GROQ_API_KEY
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
