<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <style>
      .stroke-line { stroke: #2d3139; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .stroke-subtle { stroke: #23262d; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fill-dot { fill: #2d3139; }
      .fill-subtle { fill: #181a20; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#090a0d"/>

  <!-- 1. Cloud Infrastructure Icon (top-left) -->
  <g transform="translate(30, 30)">
    <path class="stroke-line" d="M 10 25 A 8 8 0 0 1 18 15 A 14 14 0 0 1 42 15 A 10 10 0 0 1 50 25 A 8 8 0 0 1 44 35 L 14 35 A 8 8 0 0 1 10 25 Z"/>
    <path class="stroke-subtle" d="M 22 25 L 38 25 M 30 20 L 30 30"/>
  </g>

  <!-- 2. AI Chip / Microprocessor Die (top-center) -->
  <g transform="translate(160, 25)">
    <rect class="stroke-line" x="8" y="8" width="28" height="28" rx="4" fill="#0e1015"/>
    <rect class="stroke-subtle" x="14" y="14" width="16" height="16" rx="2"/>
    <circle class="fill-dot" cx="22" cy="22" r="2.5"/>
    <!-- Pins -->
    <path class="stroke-subtle" d="M 14 4 L 14 8 M 22 4 L 22 8 M 30 4 L 30 8"/>
    <path class="stroke-subtle" d="M 14 36 L 14 40 M 22 36 L 22 40 M 30 36 L 30 40"/>
    <path class="stroke-subtle" d="M 4 14 L 8 14 M 4 22 L 8 22 M 4 30 L 8 30"/>
    <path class="stroke-subtle" d="M 36 14 L 40 14 M 36 22 L 40 22 M 36 30 L 40 30"/>
  </g>

  <!-- 3. Server Rack / Compute Node (top-right) -->
  <g transform="translate(310, 25)">
    <rect class="stroke-line" x="6" y="6" width="34" height="40" rx="3" fill="#0e1015"/>
    <line class="stroke-subtle" x1="6" y1="19" x2="40" y2="19"/>
    <line class="stroke-subtle" x1="6" y1="32" x2="40" y2="32"/>
    <circle class="fill-dot" cx="12" cy="13" r="1.5"/>
    <circle class="fill-dot" cx="12" cy="25" r="1.5"/>
    <circle class="fill-dot" cx="12" cy="38" r="1.5"/>
    <line class="stroke-subtle" x1="20" y1="13" x2="34" y2="13"/>
    <line class="stroke-subtle" x1="20" y1="25" x2="34" y2="25"/>
    <line class="stroke-subtle" x1="20" y1="38" x2="34" y2="38"/>
  </g>

  <!-- 4. Neural Network Nodes (mid-left) -->
  <g transform="translate(35, 130)">
    <circle class="stroke-line" cx="10" cy="12" r="4"/>
    <circle class="stroke-line" cx="10" cy="36" r="4"/>
    <circle class="stroke-line" cx="36" cy="24" r="5" fill="#0e1015"/>
    <line class="stroke-subtle" x1="14" y1="12" x2="31" y2="22"/>
    <line class="stroke-subtle" x1="14" y1="36" x2="31" y2="26"/>
  </g>

  <!-- 5. Database Cylinder (mid-center) -->
  <g transform="translate(170, 125)">
    <ellipse class="stroke-line" cx="22" cy="10" rx="16" ry="6" fill="#0e1015"/>
    <path class="stroke-line" d="M 6 10 L 6 34 A 16 6 0 0 0 38 34 L 38 10"/>
    <path class="stroke-subtle" d="M 6 22 A 16 6 0 0 0 38 22"/>
    <line class="stroke-subtle" x1="14" y1="28" x2="22" y2="28"/>
  </g>

  <!-- 6. Kubernetes Helm / Microservices (mid-right) -->
  <g transform="translate(305, 135)">
    <circle class="stroke-line" cx="24" cy="24" r="14" fill="#0e1015"/>
    <circle class="stroke-subtle" cx="24" cy="24" r="5"/>
    <path class="stroke-subtle" d="M 24 10 L 24 4 M 24 38 L 24 44 M 10 24 L 4 24 M 38 24 L 44 24"/>
    <path class="stroke-subtle" d="M 14 14 L 10 10 M 34 34 L 38 38 M 14 34 L 10 38 M 34 14 L 38 10"/>
  </g>

  <!-- 7. Cost Sparkline / Telemetry Trend (center-grid) -->
  <g transform="translate(240, 80)">
    <polyline class="stroke-line" points="6,26 16,14 24,20 34,8 44,12"/>
    <circle class="fill-dot" cx="34" cy="8" r="2"/>
    <path class="stroke-subtle" d="M 4 30 L 46 30"/>
  </g>

  <!-- 8. Code / API Braces (left-center) -->
  <g transform="translate(100, 85)">
    <path class="stroke-line" d="M 14 6 L 8 16 L 14 26"/>
    <path class="stroke-line" d="M 26 6 L 32 16 L 26 26"/>
    <line class="stroke-subtle" x1="22" y1="8" x2="18" y2="24"/>
  </g>

  <!-- 9. Telemetry Waveform / Voice Audio (lower-mid-left) -->
  <g transform="translate(105, 175)">
    <path class="stroke-subtle" d="M 6 18 L 12 18 L 15 8 L 19 28 L 23 12 L 27 22 L 31 18 L 38 18"/>
  </g>

  <!-- 10. Security Shield / Policy Enforcer (lower-left) -->
  <g transform="translate(30, 230)">
    <path class="stroke-line" d="M 10 10 L 25 6 L 40 10 C 40 25 25 36 25 36 C 25 36 10 25 10 10 Z" fill="#0e1015"/>
    <polyline class="stroke-subtle" points="18,19 23,24 32,15"/>
  </g>

  <!-- 11. Cost / Dollar Token (lower-center) -->
  <g transform="translate(165, 235)">
    <circle class="stroke-line" cx="22" cy="22" r="16" fill="#0e1015"/>
    <path class="stroke-subtle" d="M 22 12 L 22 32 M 17 17 C 17 14 26 14 26 19 C 26 24 17 22 17 27 C 17 31 26 31 26 28"/>
  </g>

  <!-- 12. GPU Fan / Cooler Matrix (lower-right) -->
  <g transform="translate(300, 235)">
    <rect class="stroke-line" x="6" y="6" width="34" height="34" rx="4" fill="#0e1015"/>
    <circle class="stroke-subtle" cx="23" cy="23" r="10"/>
    <circle class="fill-dot" cx="23" cy="23" r="3"/>
    <path class="stroke-subtle" d="M 23 13 C 27 16 27 20 23 23 C 19 26 19 30 23 33"/>
    <path class="stroke-subtle" d="M 13 23 C 16 19 20 19 23 23 C 26 27 30 27 33 23"/>
  </g>

  <!-- 13. Terminal Prompt / CLI (bottom-left) -->
  <g transform="translate(35, 330)">
    <rect class="stroke-line" x="6" y="6" width="36" height="26" rx="3" fill="#0e1015"/>
    <path class="stroke-subtle" d="M 12 14 L 17 19 L 12 24"/>
    <line class="stroke-subtle" x1="20" y1="24" x2="28" y2="24"/>
  </g>

  <!-- 14. Anomaly Alert Bell / Flame (bottom-center) -->
  <g transform="translate(165, 330)">
    <path class="stroke-line" d="M 22 8 A 12 12 0 0 1 34 20 L 37 28 L 7 28 L 10 20 A 12 12 0 0 1 22 8 Z" fill="#0e1015"/>
    <path class="stroke-subtle" d="M 18 32 A 4 4 0 0 0 26 32"/>
    <circle class="fill-dot" cx="22" cy="18" r="1.5"/>
  </g>

  <!-- 15. Global CDN / Edge Routing Node (bottom-right) -->
  <g transform="translate(310, 330)">
    <circle class="stroke-line" cx="22" cy="22" r="16" fill="#0e1015"/>
    <ellipse class="stroke-subtle" cx="22" cy="22" rx="7" ry="16"/>
    <line class="stroke-subtle" x1="6" y1="22" x2="38" y2="22"/>
  </g>

  <!-- 16. Cluster Nodes (center-right) -->
  <g transform="translate(235, 175)">
    <circle class="fill-dot" cx="12" cy="12" r="2.5"/>
    <circle class="fill-dot" cx="32" cy="16" r="2.5"/>
    <circle class="fill-dot" cx="20" cy="32" r="2.5"/>
    <line class="stroke-subtle" x1="12" y1="12" x2="32" y2="16"/>
    <line class="stroke-subtle" x1="32" y1="16" x2="20" y2="32"/>
    <line class="stroke-subtle" x1="20" y1="32" x2="12" y2="12"/>
  </g>

  <!-- 17. Microservice Hexagons (lower-center-right) -->
  <g transform="translate(230, 290)">
    <polygon class="stroke-subtle" points="20,6 32,13 32,27 20,34 8,27 8,13" fill="#0e1015"/>
    <circle class="fill-dot" cx="20" cy="20" r="2"/>
  </g>

  <!-- Subtle Scattered Tech Matrix Dots -->
  <circle class="fill-subtle" cx="12" cy="100" r="1.5"/>
  <circle class="fill-subtle" cx="95" cy="40" r="1.5"/>
  <circle class="fill-subtle" cx="140" cy="140" r="1.5"/>
  <circle class="fill-subtle" cx="280" cy="40" r="1.5"/>
  <circle class="fill-subtle" cx="380" cy="110" r="1.5"/>
  <circle class="fill-subtle" cx="130" cy="290" r="1.5"/>
  <circle class="fill-subtle" cx="280" cy="220" r="1.5"/>
  <circle class="fill-subtle" cx="385" cy="290" r="1.5"/>
  <circle class="fill-subtle" cx="110" cy="380" r="1.5"/>
  <circle class="fill-subtle" cx="280" cy="380" r="1.5"/>
</svg>