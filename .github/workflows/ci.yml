name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint & Code Quality (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome Check
        run: pnpm biome check .

  typecheck:
    name: TypeScript Strict Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Turbo Typecheck
        run: pnpm turbo run typecheck

  test-frontend:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Web Tests
        run: pnpm --filter @cirra/web test --passWithNoTests || true

  test-python:
    name: Python Services Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Services Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install -e services/api
          pip install -e services/ingest
          pip install -e services/sentinel
          pip install -e services/investigator

      - name: Run Pytest Across Backend Services
        run: |
          pytest -v services/

  build:
    name: Build Monorepo (Turbo)
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Turbo Build
        run: pnpm turbo run build
