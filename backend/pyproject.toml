[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirra-api"
version = "0.1.0"
description = "Cirra Control Plane API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "httpx>=0.27.0",
  "redis[asyncio]>=5.0.0",
  "celery[redis]>=5.3.0",
  "boto3>=1.34.0",
  "google-cloud-bigquery>=3.20.0",
  "cryptography>=42.0.0",
  "clickhouse-connect>=0.7.0",
  "openai>=1.25.0",
  "langchain>=0.2.0",
  "statsmodels>=0.14.0",
  "scikit-learn>=1.4.0",
  "pandas>=2.2.0",
  "sqlparse>=0.5.0",
  "pyyaml>=6.0.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
