version: "1.0"
models:
  - name: cost_facts
    description: "Normalized cloud cost facts"
    dimensions: [tenant_id, provider, service_name, resource_id]
    measures: [billed_cost, effective_cost]
  - name: ai_usage_facts
    description: "AI inference token facts"
    dimensions: [tenant_id, model, api_key_id, team_tag, customer_tag]
    measures: [input_tokens, output_tokens, cost_usd]
